<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sophia Deutsch Akademie 과제 첨삭 리포트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#262220;--mute:#6b665f;--line:#e3e0d8;--acc:#456b5a;--accbg:#dde8e1;--hero:#223029;--good:#3a7d5c;--bad:#a84840;--warn:#9e7a2a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:inline-flex;width:24px;height:28px;flex:none}
.logo svg{width:100%;height:100%}
.brand{font-weight:700;font-size:14px;flex:1;min-width:0}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px;line-height:1.3}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 64px}
h1{font-size:24px;line-height:1.35;margin:6px 0 4px}
h2{font-size:18px;margin:0 0 6px;line-height:1.45}
h3{font-size:15px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:14.5px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvbtn[aria-pressed="true"],.lvbtn[aria-pressed="true"]:hover{border-color:var(--acc);background:var(--accbg)}
.lvbtn.none span{opacity:.8}
.lvbtn b.lg{font-size:15px;line-height:1.3;display:block;overflow-wrap:anywhere}
@media (max-width:480px){.levels{grid-template-columns:repeat(2,1fr)}.lvbtn b.lg{font-size:14px}}
.levels.l4{grid-template-columns:repeat(4,1fr)}
@media (max-width:480px){.levels.l4{grid-template-columns:repeat(2,1fr)}}
.lvsel h2{margin-bottom:10px}
@media (max-width:420px){.lvbtn{padding:14px 10px}.lvbtn b{font-size:22px}.lvbtn span{font-size:12.5px;line-height:1.5}}
.lvbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px 16px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.lvbtn:hover,.lvbtn:focus-visible{border-color:var(--acc);background:#f1f6f3;outline:none}
.lvbtn b{display:block;font-size:26px;line-height:1.2;letter-spacing:.01em;margin-bottom:4px}
.lvbtn span{display:block;color:var(--mute);font-size:13.5px;line-height:1.5}
.back{border:none;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:8px;font-size:14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.namebtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 12px;font-size:16px;font-weight:600;cursor:pointer;text-align:center}
.namebtn:hover,.namebtn:focus-visible{border-color:var(--acc);background:#f1f6f3;outline:none}
.empty{color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:14px 0}
.pw label{display:block;font-weight:600;margin-bottom:6px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;letter-spacing:.04em;background:#fff;color:var(--ink)}
.pwrow input:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
.btn{border:1.5px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accbg)}
.btn.main{background:var(--acc);color:#fff}
.btn.main:hover{background:#3a5c4d}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{min-height:1.6em;margin-top:8px;font-size:14px;color:var(--mute)}
.msg.err{color:var(--bad)}
.vhead{background:var(--hero);color:#fff;border-radius:14px;padding:20px 18px;margin-bottom:14px}
.vhead .who{font-size:24px;font-weight:700;line-height:1.3}
.vhead .lv{opacity:.75;font-size:13.5px}
.vhead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vhead .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.vhead .btn:hover{background:rgba(255,255,255,.12)}
.chart-wrap{width:100%}
svg.chart{display:block;width:100%;height:auto}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px 3px 8px;font-size:13px;font-weight:600;cursor:pointer}
.chip svg{width:14px;height:14px;flex:none}
.chip.off{opacity:.45;text-decoration:line-through}
.chip[aria-pressed="true"]{border-color:#bdb8ab}
.note{color:var(--mute);font-size:13px;margin:6px 0 0}
table.tb{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tb th,.tb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;white-space:normal}
.tb th{font-size:12.5px;color:var(--mute);font-weight:600}
.tb small{display:block;color:var(--mute);font-size:11.5px;line-height:1.3}
.up{color:var(--good);font-weight:700}
.down{color:var(--bad);font-weight:700}
.same{color:var(--mute);font-weight:600}
.vgraph .vsum{margin:4px 0 8px;font-size:14.5px}
.vgraph .vsum b{color:var(--acc)}
.vgraph .tabs{margin:6px 0 4px}
.vgraph svg.chart .pt{cursor:pointer}
.vgraph .vlg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;font-size:12.5px;color:var(--mute)}
.vgraph .vlg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tbscroll{overflow-x:auto}
.sumtxt p{margin:2px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.tab[aria-selected="true"]{border-color:var(--acc);background:var(--accbg);color:#2f5a47}
#tabs,#gtabs{flex-direction:column;flex-wrap:nowrap;gap:6px}
#tabs .tab,#gtabs .tab{display:grid;grid-template-columns:3.2em 1fr;align-items:baseline;column-gap:10px;width:100%;padding:9px 12px}
.tab .tn{white-space:nowrap}
.tab .tt{display:block;overflow-wrap:anywhere}
.tab .tt small{display:block;font-weight:500;color:#6b665f;margin-top:1px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
iframe#rf,iframe#vf,iframe#gf,iframe#xf{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:#f6f5f2;min-height:420px}
.foot{color:var(--mute);font-size:12.5px;text-align:center;margin-top:28px}
.mtabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
.mtab{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;font-weight:700;font-size:16px;cursor:pointer;text-align:center}
.mtab:hover,.mtab:focus-visible{border-color:var(--acc);outline:none}
.mtab[aria-selected="true"]{border-color:var(--acc);background:var(--accbg);color:#2f5a47}
@media (max-width:420px){.mtabs{gap:6px}.mtab{font-size:14px;padding:12px 4px;overflow-wrap:normal}}
@media (max-width:340px){.mtab{font-size:12.5px}}

[hidden]{display:none!important}
.login{min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 0 24px}
.lg-logo{width:60px;height:69px;margin-bottom:18px}
.lg-logo svg{width:100%;height:100%;display:block}
.lg-brand{font-size:24px;font-weight:700;letter-spacing:.01em;line-height:1.3;text-align:center}
.lg-title{font-size:16px;color:var(--mute);margin:4px 0 26px;text-align:center}
.lg-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
.lg-card label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.lg-card .fld{margin-bottom:16px}
.lg-card input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.lg-card input:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
.lg-card .pwrow{flex-wrap:nowrap}
.lg-card .pwrow input{width:auto;flex:1;min-width:0}
.lg-card .pwrow .btn{flex:none}
.lg-card .btn.main{width:100%;padding:12px;font-size:15px}
.lg-help{color:var(--mute);font-size:13px;margin:14px 0 0;text-align:center}
@media (max-width:480px){h1{font-size:21px}.vhead .who{font-size:21px}}
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="top-in">
<span class="logo"><svg viewBox="0 0 1157 1332" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="0,320 686,0 686,707 0,1027" fill="#57585A"/><polygon points="235,501 921,153 921,860 235,1180" fill="#ED1B24"/><polygon points="470,655 1157,305 1157,985 470,1332" fill="#F2C811"/></svg></span>
<div class="brand">Sophia Deutsch Akademie<small>과제 첨삭 리포트</small></div>
</div></header>
<main class="wrap" id="app"></main>

<script>
(function(){
'use strict';
var ITER=600000;
var AREAS=[
 {k:'grammar',  name:'문법',        color:'#2e5f8a', shape:'circle'},
 {k:'vocab',    name:'어휘',        color:'#3a7d5c', shape:'square'},
 {k:'reading',  name:'독해',        color:'#8a4f7d', shape:'triangle'},
 {k:'listening',name:'듣기',        color:'#b0653a', shape:'diamond'},
 {k:'satz',     name:'문장 만들기', color:'#5b6b78', shape:'circleo'},
 {k:'writing',  name:'작문(추정)',  color:'#1f8f8f', shape:'squareo'}
];
var AVG={k:'avg',name:'평균',color:'#262220',shape:'bar'};
var app=document.getElementById('app');
var session=null, hidden={}, objUrls=[], curLevel=null, adminKeep=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(s,r){return (r||document).querySelector(s);}

/* 아이디에서 파일 이름 계산 */
async function deriveId(raw){
 if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
 var s=raw.normalize('NFKC').trim().replace(/\s+/g,'').toLowerCase();
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(s),'PBKDF2',false,['deriveBits']);
 var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('ha-report-id-v1'),iterations:200000,hash:'SHA-256'},km,80);
 return Array.prototype.map.call(new Uint8Array(bits),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
}
/* 암호 해독 */
async function decryptBundle(buf,pw,id){
 if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
 var b=new Uint8Array(buf), salt=b.slice(0,16), iv=b.slice(16,28), ct=b.slice(28);
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().normalize('NFKC')),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,additionalData:new TextEncoder().encode(id)},key,ct);
 return JSON.parse(new TextDecoder().decode(pt));
}

/* 로그인 */
var fails=0;
function viewLogin(){
 session=null; hidden={}; curLevel=null; vLevel=null; $('#top').hidden=true;
 app.innerHTML='<div class="login"><div class="lg-logo"><svg viewBox="0 0 1157 1332" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="0,320 686,0 686,707 0,1027" fill="#57585A"/><polygon points="235,501 921,153 921,860 235,1180" fill="#ED1B24"/><polygon points="470,655 1157,305 1157,985 470,1332" fill="#F2C811"/></svg></div>'
  +'<div class="lg-brand">Sophia Deutsch Akademie</div><div class="lg-title">과제 첨삭 리포트</div>'
  +'<form class="lg-card" id="lf" autocomplete="on">'
  +'<div class="fld"><label for="uid">아이디</label><input id="uid" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="이름"></div>'
  +'<div class="fld"><label for="pwi">비밀번호</label><div class="pwrow"><input id="pwi" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="20자리"><button type="button" class="btn" id="sh">보기</button></div></div>'
  +'<button type="submit" class="btn main" id="go">로그인</button><div class="msg" id="pm" role="status"></div></form>'
  +'<p class="lg-help">아이디는 이름입니다. 비밀번호는 선생님께 받은 20자리입니다.</p></div>';
 var uid=$('#uid'), inp=$('#pwi'), msg=$('#pm'), go=$('#go');
 uid.focus();
 $('#sh').addEventListener('click',function(){var t=inp.type==='password';inp.type=t?'text':'password';this.textContent=t?'숨기기':'보기';});
 $('#lf').addEventListener('submit',async function(e){
  e.preventDefault();
  if(!uid.value.trim()||!inp.value.trim()){msg.className='msg err';msg.textContent='아이디와 비밀번호를 입력하십시오.';return;}
  go.disabled=true; msg.className='msg'; msg.textContent='확인하고 있습니다. 잠시 기다려 주십시오.';
  try{
   var sid=await deriveId(uid.value);
   var r=await fetch('data/'+sid+'.bin',{cache:'no-store'});
   if(r.status===404) throw new Error('bad');
   if(!r.ok) throw new Error('fetch');
   var data=await decryptBundle(await r.arrayBuffer(),inp.value,sid);
   fails=0; session={data:data,sid:sid,pw:(data&&data.role==='admin')?inp.value:null}; inp.value=''; viewReport();
  }catch(err){
   if(err&&err.message==='nocrypto'){msg.className='msg err';msg.textContent='이 브라우저에서는 열 수 없습니다. 주소가 https로 시작하는지 확인하고, 최신 Chrome이나 Safari로 다시 여십시오.';go.disabled=false;return;}
   if(err&&err.message==='fetch'){msg.className='msg err';msg.textContent='파일을 불러오지 못했습니다. 잠시 뒤 다시 시도하십시오.';go.disabled=false;return;}
   fails++; msg.className='msg err';
   msg.textContent='아이디나 비밀번호가 맞지 않습니다. 비밀번호는 대문자와 소문자를 구분합니다. 숫자 0, 1과 영문 O, I, l은 쓰지 않습니다.';
   setTimeout(function(){go.disabled=false;inp.focus();inp.select();},Math.min(fails,6)*800);
  }
 });
}

/* 그래프 */
function marker(shape,x,y,c,r){
 var s='';
 if(shape==='circle') s='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+c+'"/>';
 else if(shape==='circleo') s='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#fff" stroke="'+c+'" stroke-width="2.2"/>';
 else if(shape==='square') s='<rect x="'+(x-r)+'" y="'+(y-r)+'" width="'+2*r+'" height="'+2*r+'" fill="'+c+'"/>';
 else if(shape==='squareo') s='<rect x="'+(x-r)+'" y="'+(y-r)+'" width="'+2*r+'" height="'+2*r+'" fill="#fff" stroke="'+c+'" stroke-width="2.2"/>';
 else if(shape==='triangle') s='<polygon points="'+x+','+(y-r-1)+' '+(x+r+1)+','+(y+r)+' '+(x-r-1)+','+(y+r)+'" fill="'+c+'"/>';
 else if(shape==='diamond') s='<polygon points="'+x+','+(y-r-1)+' '+(x+r+1)+','+y+' '+x+','+(y+r+1)+' '+(x-r-1)+','+y+'" fill="'+c+'"/>';
 else s='<circle cx="'+x+'" cy="'+y+'" r="'+(r+1)+'" fill="'+c+'" stroke="#fff" stroke-width="1.5"/>';
 return s;
}
function fmtDate(d){var p=String(d||'').split('-');return p.length===3?(+p[1])+'.'+(+p[2]):'';}
function seriesFor(exams,a){
 return exams.map(function(e){
  if(a.k==='avg'){
   var v=AREAS.map(function(x){return e.scores[x.k];}).filter(function(x){return x!=null;});
   return v.length?Math.round(v.reduce(function(p,c){return p+c;},0)/v.length):null;
  }
  var q=e.scores[a.k]; return q==null?null:q;
 });
}
function drawChart(exams){
 var cwEl=document.getElementById('cw'), W=Math.max(300,Math.min(720,(cwEl&&cwEl.clientWidth)||680)), H=W<520?320:340, L=W<520?36:44, R=W<520?14:22, T=14, B=52, pw=W-L-R, ph=H-T-B, n=exams.length;
 function X(i){return n===1?L+pw/2:L+pw*i/(n-1);}
 function Y(v){return T+ph*(1-v/100);}
 var g='';
 for(var v=0;v<=100;v+=20){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e3e0d8" stroke-width="1"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" font-size="12" text-anchor="end" fill="#6b665f">'+v+'</text>';}
 g+='<text x="10" y="'+(T+ph/2)+'" font-size="12" fill="#6b665f" text-anchor="middle" transform="rotate(-90 10 '+(T+ph/2)+')">%</text>';
 exams.forEach(function(e,i){
  g+='<text x="'+X(i)+'" y="'+(H-B+20)+'" font-size="13" font-weight="600" text-anchor="middle" fill="#262220">'+e.n+'회</text><text x="'+X(i)+'" y="'+(H-B+37)+'" font-size="11.5" text-anchor="middle" fill="#6b665f">'+fmtDate(e.date)+'</text>';
 });
 var all=AREAS.concat([AVG]);
 all.forEach(function(a){
  if(hidden[a.k]) return;
  var vals=seriesFor(exams,a), pts=[];
  function OFF(i){
   if(a.k==='avg') return 0;
   var same=AREAS.filter(function(x){return !hidden[x.k]&&seriesFor(exams,x)[i]===vals[i];});
   var idx=same.map(function(x){return x.k;}).indexOf(a.k);
   return same.length>1?(idx-(same.length-1)/2)*10:0;
  }
  vals.forEach(function(v,i){if(v!=null)pts.push([X(i)+OFF(i),Y(v),v,i]);});
  if(!pts.length) return;
  var avg=a.k==='avg';
  if(pts.length>1){
   var segs=[],cur=[];
   vals.forEach(function(v,i){if(v==null){if(cur.length)segs.push(cur);cur=[];}else cur.push((X(i)+OFF(i))+','+Y(v));});
   if(cur.length)segs.push(cur);
   segs.forEach(function(sg){if(sg.length>1)g+='<polyline points="'+sg.join(' ')+'" fill="none" stroke="'+a.color+'" stroke-width="'+(avg?3.2:2.2)+'" stroke-linejoin="round" stroke-linecap="round"'+(avg?' stroke-dasharray="7 5"':'')+'/>';});
  }
  pts.forEach(function(p){g+='<g>'+marker(a.shape,p[0],p[1],a.color,avg?5:5)+'<title>'+esc(a.name)+' '+exams[p[3]].n+'회: '+p[2]+'%</title></g>';});
 });
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="시험 회차별 영역 점수 그래프">'+g+'</svg>';
}
function legendHtml(){
 return AREAS.concat([AVG]).map(function(a){
  var on=!hidden[a.k];
  return '<button type="button" class="chip'+(on?'':' off')+'" data-k="'+a.k+'" aria-pressed="'+on+'"><svg viewBox="0 0 14 14">'+(a.shape==='bar'?'<line x1="1" x2="13" y1="7" y2="7" stroke="'+a.color+'" stroke-width="3" stroke-dasharray="4 2"/>':marker(a.shape,7,7,a.color,4))+'</svg>'+esc(a.name)+'</button>';
 }).join('');
}
function changeHtml(first,last){
 if(first==null||last==null) return '<span class="same">-</span>';
 var d=last-first;
 if(d>0) return '<span class="up">▲ +'+d+'%p</span>';
 if(d<0) return '<span class="down">▼ −'+Math.abs(d)+'%p</span>';
 return '<span class="same">= 0%p</span>';
}
function tableHtml(exams){
 var h='<div class="tbscroll"><table class="tb"><thead><tr><th>영역</th>';
 exams.forEach(function(e){h+='<th>'+e.n+'회</th>';});

 var g='', v;
 for(v=lo;v<=hi;v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e3e0d8"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" font-size="12" text-anchor="end" fill="#6b665f">'+v+'</text>';
 st.forEach(function(x,i){g+='<text x="'+X(i)+'" y="'+(H-B+22)+'" font-size="13" font-weight="'+(i===vm.sel?700:500)+'" text-anchor="middle" fill="'+(i===vm.sel?'#2f5a47':'#262220')+'">'+x.n+'주</text>';});
 var segs=[],cur=[];
 vals.forEach(function(val,i){if(val==null){if(cur.length)segs.push(cur);cur=[];}else cur.push(X(i)+','+Y(val));});
 if(cur.length)segs.push(cur);
 segs.forEach(function(sg){if(sg.length>1)g+='<polyline points="'+sg.join(' ')+'" fill="none" stroke="#456b5a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';});
 st.forEach(function(x,i){
  var val=vals[i]; if(val==null) return;
  var c=(k==='score'&&GRC[x.grade])||'#456b5a', on=i===vm.sel;
  g+='<g class="pt" data-i="'+i+'"><circle cx="'+X(i)+'" cy="'+Y(val)+'" r="16" fill="transparent"/>'+(on?'<circle cx="'+X(i)+'" cy="'+Y(val)+'" r="9" fill="none" stroke="'+c+'" stroke-width="1.6" opacity=".45"/>':'')+'<circle cx="'+X(i)+'" cy="'+Y(val)+'" r="5.5" fill="'+c+'" stroke="#fff" stroke-width="1.5"/><text x="'+X(i)+'" y="'+(Y(val)-12)+'" font-size="12.5" font-weight="700" text-anchor="middle" fill="#262220">'+val+'</text><title>'+x.n+'주차 '+VMET.filter(function(m){return m.k===k;})[0].name+' '+val+VMET.filter(function(m){return m.k===k;})[0].u+'</title></g>';
 });
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="주차별 '+VMET.filter(function(m){return m.k===k;})[0].name+' 그래프">'+g+'</svg>';
}
function vokaSummary(){
 var k=vm.cur, m=VMET.filter(function(x){return x.k===k;})[0], p=vm.st.filter(function(x){return x[k]!=null;});
 if(p.length<2) return '';
 var a=p[0], z=p[p.length-1], d=z[k]-a[k], u=m.u==='%'?'%':m.u, dd=Math.abs(d)+(m.u==='%'?'%p':m.u);
 if(d===0) return a.n+'주차와 '+z.n+'주차 모두 <b>'+z[k]+u+'</b>'+(m.u==='%'?'예요.':'이에요.');
 return a.n+'주차 <b>'+a[k]+u+'</b>에서 '+z.n+'주차 <b>'+z[k]+u+'</b>'+(m.u==='점'?'으로 ':'로 ')+dd+(d>0?' 올랐어요.':' 내려갔어요.');
}
function vokaDraw(){
 var w=$('#vgw'); if(!w) return;
 w.innerHTML=vokaChart();
 $('#vgs').innerHTML=vokaSummary();
 $('#vgn').textContent=VNOTE[vm.cur];
 $('#vlg').style.display=vm.cur==='score'?'':'none';
}
function vokaGraphHtml(V){
 vm.st=V.map(vokaStats); vm.sel=V.length-1;
 var av=VMET.filter(function(m){return vm.st.filter(function(x){return x[m.k]!=null;}).length>=2;});
 if(!av.length) return '';
 if(!av.some(function(m){return m.k===vm.cur;})) vm.cur=av[0].k;
 var h='<section class="card vgraph" style="padding:16px"><h2 style="margin:0 0 4px">학습 성과</h2><div class="vsum" id="vgs"></div>';
 if(av.length>1){h+='<div class="tabs" id="vmt" role="tablist">'; av.forEach(function(m){h+='<button class="tab" role="tab" data-k="'+m.k+'" aria-selected="'+(m.k===vm.cur)+'">'+m.name+'</button>';}); h+='</div>';}
 h+='<div class="chart-wrap" id="vgw"></div><div class="vlg" id="vlg"><span><i style="background:'+GRC.S+'"></i>S</span><span><i style="background:'+GRC.A+'"></i>A</span><span><i style="background:'+GRC.B+'"></i>B</span></div><p class="note" id="vgn"></p><p class="note">점을 누르면 그 주차 리포트로 이동해요.</p></section>';
 return h;
}
/* VOKA 탭: 레벨(A1-A2, B1, B2, C1)을 고른 뒤 주차별 학생용 리포트를 봅니다. A1과 A2로 올린 기록은 A1-A2로 묶습니다 */
var VLV=['A1-A2','B1','B2','C1'], vLevel=null;
function vGroup(L){return (L==='A1'||L==='A2')?'A1-A2':L;}
function vokaOf(d,G){return (d.voka||[]).filter(function(x){return vGroup(lvOf(x,d))===G;}).sort(function(p,q){return p.n-q.n;});}
function vokaLevels(d){
 var L=VLV.slice();
 (d.voka||[]).forEach(function(x){var g=vGroup(lvOf(x,d)); if(L.indexOf(g)<0) L.push(g);});
 return L;
}
function vokaStart(d){
 var best=null;
 (d.voka||[]).forEach(function(x){if(!best||String(x.date||'')>String(best.date||'')||(String(x.date||'')===String(best.date||'')&&x.n>=best.n))best=x;});
 return best?vGroup(lvOf(best,d)):VLV[0];
}
function vokaBtns(d){
 return vokaLevels(d).map(function(L){
  var c=vokaOf(d,L).length;
  return '<button type="button" class="lvbtn'+(c?'':' none')+'" data-l="'+esc(L)+'" aria-pressed="'+(L===vLevel)+'"><b>'+esc(L)+'</b>'+(c?'<span>리포트 '+c+'개</span>':'<span>등록된 리포트 없음</span>')+'</button>';
 }).join('');
}
function renderVoka(){
 var d=session.data, pane=$('#pane-voka');
 if(!vLevel) vLevel=vokaStart(d);
 if(!(d.voka||[]).length){pane.innerHTML='<div class="empty"><b>VOKA</b> 리포트가 아직 없습니다.<br>VOKA 리포트가 등록되면 여기에 표시됩니다.</div>';return;}
 pane.innerHTML='<section class="card lvsel"><h2>레벨 선택</h2><div class="levels l4" id="vlvs" role="group" aria-label="VOKA 레벨 선택">'+vokaBtns(d)+'</div></section><div id="vbody"></div>';
 $('#vlvs').addEventListener('click',function(e){
  var b=e.target.closest('.lvbtn'); if(!b||b.dataset.l===vLevel) return;
  vLevel=b.dataset.l;
  $('#vlvs').querySelectorAll('.lvbtn').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.l===vLevel?'true':'false');});
  vm.cur='score'; renderVokaLevel();
 });
 renderVokaLevel();
}
function renderVokaLevel(){
 var d=session.data, V=vokaOf(d,vLevel), pane=$('#vbody');
 window.onresize=null;
 if(!V.length){pane.innerHTML='<div class="empty"><b>'+esc(vLevel)+'</b> VOKA 리포트가 아직 없습니다.<br>VOKA 리포트가 등록되면 여기에 표시됩니다.</div>';return;}
 var h=vokaGraphHtml(V);
 h+='<section class="card" style="padding:16px"><div class="rhead"><h2 style="margin:0">VOKA 주간 리포트</h2><button class="btn" id="vnw" style="display:none">새 창으로 열기</button></div>';
 h+='<div class="tabs" id="vtabs" role="tablist">';
 V.forEach(function(r,i){h+='<button class="tab" role="tab" data-i="'+i+'" aria-selected="'+(i===V.length-1)+'">'+r.n+'주차</button>';});
 h+='</div><iframe id="vf" title="VOKA 리포트" sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-downloads"></iframe></section>';
 pane.innerHTML=h;
 showReport(V,V.length-1,'vf','vnw');
 function pick(i){
  var tabs=$('#vtabs').querySelectorAll('.tab');
  tabs.forEach(function(x,j){x.setAttribute('aria-selected',j===i?'true':'false');});
  showReport(V,i,'vf','vnw'); vm.sel=i; vokaDraw();
 }
 $('#vtabs').addEventListener('click',function(e){
  var t=e.target.closest('.tab'); if(!t) return;
  pick(+t.dataset.i);
 });
 if($('#vgw')){
  vokaDraw();
  var mt=$('#vmt');
  if(mt) mt.addEventListener('click',function(e){
   var t=e.target.closest('.tab'); if(!t) return;
   vm.cur=t.dataset.k; mt.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===t?'true':'false');}); vokaDraw();
  });
  $('#vgw').addEventListener('click',function(e){
   var g=e.target.closest('.pt'); if(!g) return;
   pick(+g.dataset.i);
   var f=$('#vtabs'); if(f) f.scrollIntoView({behavior:'smooth',block:'start'});
  });
  var rt; window.onresize=function(){clearTimeout(rt);rt=setTimeout(vokaDraw,150);};
 }
}
function renderLevel(L){
 var d=session.data, it=itemsFor(d,L), exams=it.exams, reps=it.reps;
 curLevel=L; window.onresize=null;
 $('#lvs').innerHTML=levelBtns(d);
 var body=$('#lvbody');
 if(!exams.length&&!reps.length){
  body.innerHTML='<div class="empty"><b>'+esc(L)+'</b> 시험 기록과 리포트가 아직 없습니다.<br>'+esc(L)+' 리포트가 등록되면 여기에 표시됩니다.</div>';
  return;
 }
 var h='<section class="card"><h2>'+esc(L)+' 발전 기록</h2>';
 if(!exams.length) h+='<p class="note">아직 '+esc(L)+' 시험 기록이 없습니다.</p>';
 else h+='<div class="chart-wrap" id="cw"></div><div class="legend" id="lg">'+legendHtml()+'</div><p class="note">영역 이름을 누르면 선을 숨기거나 다시 보입니다. 작문은 선생님이 추정한 레벨 부합도이고, 나머지는 정답률입니다.</p>'+summaryHtml(exams)+tableHtml(exams);
 h+='</section>';
 h+='<section class="card" style="padding:16px"><div class="rhead"><h2 style="margin:0">'+esc(L)+' 리포트</h2><button class="btn" id="nw" style="display:none">새 창으로 열기</button></div>';
 if(!reps.length) h+='<p class="note">아직 등록된 '+esc(L)+' 리포트가 없습니다.</p>';
 else{
  h+='<div class="tabs" id="tabs" role="tablist">';
  reps.forEach(function(r,i){h+='<button class="tab" role="tab" data-i="'+i+'" aria-selected="'+(i===reps.length-1)+'"><span class="tn">'+r.n+'회</span><span class="tt">'+esc(r.title)+'<small>'+esc(r.date||'')+'</small></span></button>';});
  h+='</div><iframe id="rf" title="'+esc(L)+' 리포트" sandbox="allow-scripts allow-same-origin allow-modals allow-popups allow-downloads"></iframe>';
 }
 h+='</section>';
 body.innerHTML=h;
 if(exams.length){$('#cw').innerHTML=drawChart(exams);}
 var lg=$('#lg');
 if(lg) lg.addEventListener('click',function(e){
  var b=e.target.closest('.chip'); if(!b) return;
  hidden[b.dataset.k]=!hidden[b.dataset.k];
  $('#cw').innerHTML=drawChart(exams); lg.innerHTML=legendHtml();
 });
 if(exams.length){var rt;window.onresize=function(){clearTimeout(rt);rt=setTimeout(function(){var c=$('#cw');if(c)c.innerHTML=drawChart(exams);},150);};}
 if(reps.length){
  showReport(reps,reps.length-1);
  $('#tabs').addEventListener('click',function(e){
   var t=e.target.closest('.tab'); if(!t) return;
   this.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===t?'true':'false');});
   showReport(reps,+t.dataset.i);
  });
 }
}
function showReport(reps,i,fid,nid){
 var r=reps[i], f=$('#'+(fid||'rf')), nw=$('#'+(nid||'nw'));
 f.onload=function(){
  var doc=f.contentDocument; if(!doc) return;
  function fit(){f.style.height=Math.max(420,doc.documentElement.scrollHeight)+'px';}
  fit();
  try{new ResizeObserver(fit).observe(doc.body);}catch(e){setInterval(fit,800);}
  doc.addEventListener('click',function(ev){
   var a=ev.target.closest&&ev.target.closest('a[href^="#"]'); if(!a) return;
   var t=doc.getElementById(a.getAttribute('href').slice(1)); if(!t) return;
   ev.preventDefault();
   var y=t.getBoundingClientRect().top+f.getBoundingClientRect().top+window.scrollY-12;
   window.scrollTo({top:y,behavior:'smooth'});
  });
 };
 f.srcdoc=r.html;
 nw.style.display='';
 nw.onclick=function(){
  var u=URL.createObjectURL(new Blob([r.html],{type:'text/html'})); objUrls.push(u); window.open(u,'_blank');
 };
}
function backToAdmin(){
 if(!adminKeep||!session) return;
 objUrls.forEach(function(u){URL.revokeObjectURL(u);}); objUrls=[];
 hidden={}; curLevel=null; vLevel=null; window.onresize=null;
 session.data=adminKeep; adminKeep=null;
 window.HAAdmin.open({keep:true}); window.scrollTo(0,0);
}
function previewStudent(data){
 if(!session||!session.data||session.data.role!=='admin'||adminKeep) return;
 adminKeep=session.data; session.data=data; hidden={}; curLevel=null; vLevel=null; app.className='wrap';
 viewReport();
}
function leave(){
 if(window.HAAdmin) window.HAAdmin.close();
 adminKeep=null; session=null; hidden={}; curLevel=null; vLevel=null;
 objUrls.forEach(function(u){URL.revokeObjectURL(u);}); objUrls=[];
 window.onresize=null;
 viewLogin(); window.scrollTo(0,0);
}

window.HA={app:app,$:$,esc:esc,deriveId:deriveId,decryptBundle:decryptBundle,leave:leave,preview:previewStudent,session:function(){return session;}};
viewLogin();
})();
</script>
<script src="admin.js"></script>
</body>
