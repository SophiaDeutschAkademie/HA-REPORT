<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sophia Deutsch Akademie 학습 포탈</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학습 포탈">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2E3A55">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#262220;--mute:#6b665f;--line:#e3e0d8;--acc:#2E3A55;--accbg:#e1e5ee;--hero:#2E3A55;--good:#3a7d5c;--bad:#a84840;--warn:#9e7a2a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:inline-flex;width:24px;height:28px;flex:none}
.logo svg{width:100%;height:100%}
.brand{font-weight:700;font-size:14px;flex:1;min-width:0}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px;line-height:1.3}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 64px}
h1{font-size:24px;line-height:1.35;margin:6px 0 4px}
h2{font-size:18px;margin:0 0 6px;line-height:1.45}
h3{font-size:15px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:14.5px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvbtn[aria-pressed="true"],.lvbtn[aria-pressed="true"]:hover{border-color:var(--acc);background:var(--accbg)}
.lvbtn.none span{opacity:.8}
.lvbtn b.lg{font-size:15px;line-height:1.3;display:block;overflow-wrap:anywhere}
@media (max-width:480px){.levels{grid-template-columns:repeat(2,1fr)}.lvbtn b.lg{font-size:14px}}
.levels.l4{grid-template-columns:repeat(4,1fr)}
.levels.l3{grid-template-columns:repeat(3,1fr)}
.pgl{font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.02em;margin:0 0 8px}
.pgl:not(:first-child){margin-top:18px}
@media (max-width:480px){.levels.l4{grid-template-columns:repeat(2,1fr)}}
.lvsel h2{margin-bottom:10px}
@media (max-width:420px){.lvbtn{padding:14px 10px}.lvbtn b{font-size:22px}.lvbtn span{font-size:12.5px;line-height:1.5}}
.lvbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px 16px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.lvbtn:hover,.lvbtn:focus-visible{border-color:var(--acc);background:#f1f3f8;outline:none}
.lvbtn b{display:block;font-size:26px;line-height:1.2;letter-spacing:.01em;margin-bottom:4px}
.lvbtn span{display:block;color:var(--mute);font-size:13.5px;line-height:1.5}
.back{border:none;background:none;color:var(--acc);font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:8px;font-size:14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.namebtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 12px;font-size:16px;font-weight:600;cursor:pointer;text-align:center}
.namebtn:hover,.namebtn:focus-visible{border-color:var(--acc);background:#f1f3f8;outline:none}
.empty{color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:14px 0}
.pw label{display:block;font-weight:600;margin-bottom:6px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;letter-spacing:.04em;background:#fff;color:var(--ink)}
.pwrow input:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
.btn{border:1.5px solid var(--acc);background:#fff;color:var(--acc);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accbg)}
.btn.main{background:var(--acc);color:#fff}
.btn.main:hover{background:#3B4863}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{min-height:1.6em;margin-top:8px;font-size:14px;color:var(--mute)}
.msg.err{color:var(--bad)}
.vhead{background:var(--hero);color:#fff;border-radius:14px;padding:20px 18px;margin-bottom:14px}
.vhead .who{font-size:24px;font-weight:700;line-height:1.3}
.vhead .lv{opacity:.75;font-size:13.5px}
.vhead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vhead .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.vhead .btn:hover{background:rgba(255,255,255,.12)}
.chart-wrap{width:100%}
svg.chart{display:block;width:100%;height:auto}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px 3px 8px;font-size:13px;font-weight:600;cursor:pointer}
.chip svg{width:14px;height:14px;flex:none}
.chip.off{opacity:.45;text-decoration:line-through}
.chip[aria-pressed="true"]{border-color:#bdb8ab}
.note{color:var(--mute);font-size:13px;margin:6px 0 0}
table.tb{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tb th,.tb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;white-space:normal}
.tb th{font-size:12.5px;color:var(--mute);font-weight:600}
.tb small{display:block;color:var(--mute);font-size:11.5px;line-height:1.3}
.up{color:var(--good);font-weight:700}
.down{color:var(--bad);font-weight:700}
.same{color:var(--mute);font-weight:600}
.vgraph .vsum{margin:4px 0 8px;font-size:14.5px}
.vgraph .vsum b{color:var(--acc)}
.vgraph .tabs{margin:6px 0 4px}
.vgraph svg.chart .pt{cursor:pointer}
.vgraph .vlg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;font-size:12.5px;color:var(--mute)}
.vgraph .vlg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tbscroll{overflow-x:auto}
.sumtxt p{margin:2px 0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.tab[aria-selected="true"]{border-color:var(--acc);background:var(--accbg);color:#2E3A55}
#tabs,#gtabs{flex-direction:column;flex-wrap:nowrap;gap:6px}
#tabs .tab,#gtabs .tab{display:grid;grid-template-columns:3.2em 1fr;align-items:baseline;column-gap:10px;width:100%;padding:9px 12px}
.tab .tn{white-space:nowrap}
/* 시험 준비 리포트 목록: 세로 한 줄씩, 작은 카드 */
#tabsz,#rtabs,#trtabs{flex-direction:column;flex-wrap:nowrap;gap:4px}
#tabsz .tab,#rtabs .tab,#trtabs .tab{display:grid;grid-template-columns:2.6em 1fr auto;align-items:center;column-gap:10px;width:100%;padding:5px 10px;font-size:13px;border-radius:8px;border-width:1px}
#tabsz .tab .tt,#rtabs .tab .tt,#trtabs .tab .tt{display:contents}
#tabsz .tab .tt small,#rtabs .tab .tt small,#trtabs .tab .tt small{display:inline;margin:0;font-size:12px;white-space:nowrap}
.tab .tt{display:block;overflow-wrap:anywhere}
.tab .tt small{display:block;font-weight:500;color:#6b665f;margin-top:1px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
iframe#rf,iframe#rfz,iframe#vf,iframe#gf,iframe#xf,iframe#trf{display:block;width:100%;border:1px solid var(--line);border-radius:14px;background:#f6f5f2;min-height:420px}
.foot{color:var(--mute);font-size:12.5px;text-align:center;margin-top:28px}
.mtabs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 14px}
.mtab{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;font-weight:700;font-size:16px;cursor:pointer;text-align:center}
.mtab:hover,.mtab:focus-visible{border-color:var(--acc);outline:none}
.mtab[aria-selected="true"]{border-color:var(--acc);background:var(--accbg);color:#2E3A55}
@media (max-width:420px){.mtabs{gap:6px}.mtab{font-size:14px;padding:12px 4px;overflow-wrap:normal}}
@media (max-width:340px){.mtab{font-size:12.5px}}

/* 학습 포탈 첫 화면: 나의 학습 기록 보기 / 학습 진행하기 */
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:0 0 14px}
.hubbtn{display:flex;flex-direction:column;align-items:flex-start;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:22px 20px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.hubbtn:hover,.hubbtn:focus-visible{border-color:var(--acc);background:#f1f3f8;outline:none}
.hubbtn .ic{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;background:var(--accbg);color:#2E3A55;margin-bottom:18px;flex:none}
.hubbtn .ic svg{width:24px;height:24px}
.hubbtn .tx{display:block;min-width:0}
.hubbtn b{display:block;font-size:20px;line-height:1.35;margin-bottom:4px}
.hubbtn .ds{display:block;color:var(--mute);font-size:14px;line-height:1.55}
@media (max-width:600px){.hub{grid-template-columns:1fr;gap:10px}.hubbtn{flex-direction:row;align-items:center;gap:14px;padding:16px}.hubbtn .ic{margin:0}.hubbtn b{font-size:17px;margin-bottom:2px}.hubbtn .ds{font-size:13px}}
/* 학습 진행하기 목록 */
.golist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.golist a,.golist .off{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;min-height:72px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 16px;text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
.golist a:hover,.golist a:focus-visible{border-color:var(--acc);background:#f1f3f8;outline:none}
.golist b{display:block;font-size:17px;line-height:1.35;letter-spacing:.01em}
.golist .ds{display:block;color:var(--mute);font-size:13.5px;line-height:1.5}
.golist .gar{display:flex;color:var(--acc)}
.golist .gar svg{width:20px;height:20px}
.golist .off{border-style:dashed;background:transparent;color:var(--mute)}
.golist .tag{display:inline-block;margin-left:8px;border-radius:999px;background:var(--accbg);color:#2E3A55;font-size:11.5px;font-weight:700;line-height:1.6;padding:0 8px;vertical-align:2px;letter-spacing:0}
.golist li.big{grid-column:1/-1}
.golist li.big a{min-height:96px;padding:18px 20px}
.golist li.big b{font-size:21px}
.golist li.big a{background:var(--acc);border-color:var(--acc);color:#fff}
.golist li.big a:hover,.golist li.big a:focus-visible{background:#3B4863;border-color:#3B4863}
.golist li.big .ds{color:rgba(255,255,255,.78)}
.golist li.big .gar{color:#fff}
.golist li.big .ds{font-size:14.5px}
/* 첫 화면의 격언 */
.quote{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:0 0 14px}
.quote .ey{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute);margin:0 0 10px}
.quote .de{margin:0;font-size:19px;font-weight:600;line-height:1.6;color:var(--ink);word-break:normal;overflow-wrap:break-word}
.quote .ko{margin:8px 0 0;font-size:15px;line-height:1.65;color:var(--mute)}
.quote .src{margin:12px 0 0;font-size:12.5px;color:var(--mute)}
@media (max-width:600px){.quote{padding:16px 18px}.quote .de{font-size:16.5px}.quote .ko{font-size:13.5px}.golist li.big a{min-height:84px;padding:15px 16px}.golist li.big b{font-size:19px}.golist li.big .ds{font-size:13px}}
.lg-note{width:100%;max-width:380px;margin:0 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:13.5px;line-height:1.6}
/* 로그인 화면의 「홈 화면에 추가」 버튼과 안내 창 */
.a2hs-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:380px;margin:14px 0 0;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--acc);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.a2hs-btn:hover,.a2hs-btn:focus-visible{border-color:var(--acc);background:#f1f3f8;outline:none}
.a2hs-btn svg{width:20px;height:20px;flex:none}
.a2hs-sheet{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.a2hs-bg{position:absolute;inset:0;background:rgba(20,24,36,.45)}
.a2hs-box{position:relative;width:calc(100% - 24px);max-width:440px;margin:0 0 calc(12px + env(safe-area-inset-bottom));padding:24px 22px 18px;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.2);outline:none}
.a2hs-t{margin:0 0 14px;font-size:19px;line-height:1.4}
.a2hs-c ol{margin:0 0 6px;padding:0;list-style:none;counter-reset:a2}
.a2hs-c li{position:relative;margin:0 0 12px;padding-left:34px;font-size:15px;line-height:1.6}
.a2hs-c li::before{counter-increment:a2;content:counter(a2);position:absolute;left:0;top:1px;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;font-weight:700}
.a2hs-c p{margin:0 0 14px;font-size:15px;line-height:1.6}
.a2hs-c p.n{margin:4px 0 16px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.a2hs-c svg{display:inline-block;width:19px;height:19px;vertical-align:-4px;margin:0 2px}
.a2hs-go,.a2hs-ok{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.a2hs-go{margin:0 0 18px}
.a2hs-ok.ghost{background:#e1e5ee;color:var(--acc)}
@media (min-width:641px){.a2hs-sheet{align-items:center}.a2hs-box{margin:0}}
@media print{.a2hs-btn,.a2hs-sheet{display:none!important}}
[hidden]{display:none!important}
.login{min-height:calc(100vh - 90px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 0 24px}
.lg-logo{width:60px;height:69px;margin-bottom:18px}
.lg-logo svg{width:100%;height:100%;display:block}
.lg-brand{font-size:24px;font-weight:700;letter-spacing:.01em;line-height:1.3;text-align:center}
.lg-title{font-size:16px;color:var(--mute);margin:4px 0 26px;text-align:center}
.lg-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
.lg-card label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.lg-card .fld{margin-bottom:16px}
.lg-card input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.lg-card input:focus{outline:2px solid var(--accbg);border-color:var(--acc)}
.lg-card .pwrow{flex-wrap:nowrap}
.lg-card .pwrow input{width:auto;flex:1;min-width:0}
.lg-card .pwrow .btn{flex:none}
.lg-card .btn.main{width:100%;padding:12px;font-size:15px}
.lg-help{color:var(--mute);font-size:13px;margin:14px 0 0;text-align:center}
@media (max-width:480px){h1{font-size:21px}.vhead .who{font-size:21px}}
/* 컴퓨터 화면: 휴대폰 폭(760px) 그대로 두지 않고 넓게 씁니다 */
@media (min-width:1024px){
 body{font-size:16px}
 .top-in,.wrap{max-width:1120px}
 .top-in{padding:12px 32px}
 .wrap{padding:30px 32px 72px}
 .card{padding:24px 28px}
 .vhead{padding:26px 30px}
 .vhead .who{font-size:28px}
 .mtab{padding:15px 10px;font-size:17px}
 .levels{gap:14px}
 .levels.l4{grid-template-columns:repeat(4,1fr)}
 .hubbtn{padding:28px 26px}.hubbtn b{font-size:22px}.hubbtn .ds{font-size:15px}
 .golist{grid-template-columns:repeat(2,1fr);gap:12px}
 iframe#rf,iframe#rfz,iframe#vf,iframe#gf,iframe#xf,iframe#trf{min-height:560px}
}
/* 휴대폰 화면: 글자와 여백을 줄여 한 화면에 더 많이 보이게 합니다. 위쪽 규칙보다 뒤에 두어야 적용됩니다 */
@media (max-width:480px){
 body{font-size:14px;line-height:1.7}
 .wrap{padding:16px 14px 56px}
 .card{padding:14px;margin:12px 0}
 h2{font-size:16px}
 .brand{font-size:13px}.brand small{font-size:11px}
 .vhead{padding:16px}.vhead .who{font-size:19px}.vhead .lv{font-size:12.5px}
 .mtab{font-size:13.5px;padding:10px 4px}
 .lvbtn{padding:12px}.lvbtn b{font-size:19px;margin-bottom:2px}.lvbtn b.lg{font-size:14px}.lvbtn span{font-size:12px;line-height:1.45}
 .pgl{font-size:12px}
 .tab{font-size:13px;padding:5px 10px}
 .btn{font-size:13px;padding:8px 12px}
 .note{font-size:12px}
 table.tb{font-size:13px}.tb th{font-size:12px}
 .chip{font-size:12px}
 .vgraph .vsum{font-size:13.5px}
 .lg-brand{font-size:21px}.lg-title{font-size:14.5px;margin-bottom:20px}.lg-help{font-size:12.5px}
 .golist a,.golist .off{min-height:64px;padding:11px 14px}.golist b{font-size:16px}.golist .ds{font-size:12.5px}
}
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="top-in">
<span class="logo"><svg viewBox="0 0 1157 1332" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="0,320 686,0 686,707 0,1027" fill="#57585A"/><polygon points="235,501 921,153 921,860 235,1180" fill="#ED1B24"/><polygon points="470,655 1157,305 1157,985 470,1332" fill="#F2C811"/></svg></span>
<div class="brand">Sophia Deutsch Akademie<small>학습 포탈</small></div>
</div></header>
<main class="wrap" id="app"></main>

<script src="achieve.js?v=4"></script>
<script>
(function(){
'use strict';
var ITER=600000;
var AREAS=[
 {k:'grammar',  name:'문법',        color:'#2e5f8a', shape:'circle'},
 {k:'vocab',    name:'어휘',        color:'#3a7d5c', shape:'square'},
 {k:'reading',  name:'독해',        color:'#8a4f7d', shape:'triangle'},
 {k:'listening',name:'듣기',        color:'#b0653a', shape:'diamond'},
 {k:'satz',     name:'문장 만들기', color:'#5b6b78', shape:'circleo'},
 {k:'writing',  name:'작문',  color:'#1f8f8f', shape:'squareo'}
];
var AREAS_BASE=AREAS;
/* 시험 준비(ZERTIFIKAT) 레벨: 읽기, 듣기, 쓰기, 말하기. telc 학생은 Sprachbausteine를 더합니다 */
var Z_READ={k:'reading',name:'읽기',color:'#8a4f7d',shape:'triangle'}, Z_LIST={k:'listening',name:'듣기',color:'#b0653a',shape:'diamond'},

function nextQuote(){

 try{d=JSON.parse(localStorage.getItem(K)||'null');}catch(e){d=null;}
 if(d&&typeof d.last==='number') last=d.last;
 var deck=(d&&Array.isArray(d.deck))?d.deck.filter(function(x){return typeof x==='number'&&x>=0&&x<QUOTES.length;}):[];
 if(!deck.length){
  for(i=0;i<QUOTES.length;i++) if(i!==last) deck.push(i);
  for(i=deck.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=deck[i];deck[i]=deck[j];deck[j]=t;}
 }

}

/* 아이디에서 파일 이름 계산 */
async function deriveId(raw){
 if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
 var s=raw.normalize('NFKC').trim().replace(/\s+/g,'').toLowerCase();
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(s),'PBKDF2',false,['deriveBits']);
 var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('ha-report-id-v1'),iterations:200000,hash:'SHA-256'},km,80);
 return Array.prototype.map.call(new Uint8Array(bits),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
}
/* 암호 해독: 비밀번호에서 키(32바이트)를 계산해 파일을 엽니다. 키는 로그인 유지(saveSess)에 쓰려고 함께 돌려줍니다 */
async function keyBits(pw,salt){
 if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
 var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().normalize('NFKC')),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,256));
}
async function decryptWithBits(buf,bits,id){
 if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
 var b=new Uint8Array(buf), iv=b.slice(16,28), ct=b.slice(28);
 var key=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,additionalData:new TextEncoder().encode(id)},key,ct);
 return JSON.parse(new TextDecoder().decode(pt));
}
async function openBundle(buf,pw,id){
 var bits=await keyBits(pw,new Uint8Array(buf).slice(0,16));
 return {data:await decryptWithBits(buf,bits,id),bits:bits};
}
async function decryptBundle(buf,pw,id){return (await openBundle(buf,pw,id)).data;}

/* 레벨별 자료: 시험과 리포트에 level이 없으면 학생 기본 레벨로 봅니다 */
var SHOW=['A2','B1','B2','GRAMMATIK','ZERTIFIKAT A2','ZERTIFIKAT B1','ZERTIFIKAT B2','SNU'], LORDER=['A2','B1','B2','GRAMMATIK','ZERTIFIKAT A2','ZERTIFIKAT B1','ZERTIFIKAT B2','SNU'];
function lvOf(x,d){return x.level||d.level;}
/* ZERTIFIKAT 레벨은 과제 첨삭이 아니라 "시험 준비" 탭에서 봅니다 */
function isZ(l){return /^ZERTIFIKAT/.test(l||'');}
function levelsOf(d,z){
 var L=SHOW.filter(function(k){return isZ(k)===!!z;}), seen={};
 (d.exams||[]).concat(d.reports||[]).forEach(function(x){seen[lvOf(x,d)]=1;});
 if(z) (d.results||[]).forEach(function(x){var L=resLevel(x); if(L) seen[L]=1;});
 Object.keys(seen).forEach(function(k){if(isZ(k)===!!z&&L.indexOf(k)<0&&LORDER.indexOf(k)>=0)L.push(k);});
 return L.sort(function(p,q){return LORDER.indexOf(p)-LORDER.indexOf(q);});
}
function itemsFor(d,L){
 function pick(a){return (a||[]).filter(function(x){return lvOf(x,d)===L;}).sort(function(p,q){return p.n-q.n;});}
 var reps=pick(d.reports);
 if(isZ(L)){
  /* 시험 결과(말하기 연습 등)도 같은 레벨이면 리포트 목록에 날짜순으로 함께 넣습니다. 번호는 목록 순서(seq)로 붙입니다 */
  var R=(d.results||[]).filter(function(x){return resLevel(x)===L;});
  reps=reps.map(function(x,i){return {r:x,k:0,i:i};}).concat(R.map(function(x,i){return {r:x,k:1,i:i};}))
   .sort(function(p,q){var a=String(p.r.date||''),b=String(q.r.date||'');return (a<b?-1:a>b?1:0)||(p.k-q.k)||(p.k?(p.r.n-q.r.n):(p.r.n-q.r.n));})
   .map(function(o,i){var c={};for(var k in o.r)c[k]=o.r[k];c.seq=i+1;return c;});
 }
 return {exams:pick(d.exams),reps:reps};
}
/* 시험 결과의 시험 종류(telc B2, Goethe B1 ...)에서 ZERTIFIKAT 레벨을 찾습니다. 레벨이 없는 결과(말하기 종합 등)는 null */
function resLevel(x){var m=String(x.exam||'').match(/\b(A2|B1|B2)$/);return m?'ZERTIFIKAT '+m[1]:null;}
function startLevel(d){
 var best=null;
 (d.exams||[]).forEach(function(e){if(isZ(lvOf(e,d)))return; if(!best||String(e.date||'')>=String(best.date||''))best=e;});
 return best?lvOf(best,d):(isZ(d.level)?levelsOf(d,false)[0]:d.level);
}
function levelBtns(d,z,cur){
 return levelsOf(d,z).map(function(L){
  var it=itemsFor(d,L), none=!it.exams.length&&!it.reps.length;
  return '<button type="button" class="lvbtn'+(none?' none':'')+'" data-t="lv" data-l="'+esc(L)+'" aria-pressed="'+(L===cur)+'"><b'+(!z&&L.length>3?' class="lg"':'')+'>'+esc(z?L.replace(/^ZERTIFIKAT\s*/,''):L)+'</b>'
   +(none?'<span>등록된 리포트 없음</span>':'<span>리포트 '+Math.max(it.reps.length,it.exams.length)+'개</span>')+'</button>';
 }).join('');
}

/* VOKA 학습 성과 그래프: 각 주차 리포트에 적힌 숫자를 읽어서 그립니다 */

function vokaStats(r){

  var doc=new DOMParser().parseFromString(r.html,'text/html'), sc=doc.querySelector('.score'), m;
  if(sc){m=(sc.firstChild?sc.firstChild.textContent:sc.textContent).match(/([A-Z])\s*(\d+)/); if(m){o.grade=m[1];o.score=+m[2];}}

   if(o.days==null&&/^(공부한 날|카드를 넘긴 날|앱을 연 날)/.test(lab)&&(q=v.match(/^(\d+)일$/))) o.days=+q[1];
  });

function vokaChart(){
 var st=vm.st, k=vm.cur, W=Math.max(300,Math.min(960,($('#vgw')&&$('#vgw').clientWidth)||680)), H=W<520?230:250, L=W<520?36:44, R=W<520?16:24, T=22, B=44, pw=W-L-R, ph=H-T-B, n=st.length;
 var vals=st.map(function(x){return x[k];}), nn=vals.filter(function(v){return v!=null;}), lo=0, hi=100, step=20;
 if(k==='score'){hi=Math.max(100,Math.ceil(Math.max.apply(null,nn)/10)*10); lo=Math.max(0,Math.floor((Math.min.apply(null,nn)-6)/10)*10); step=(hi-lo)>50?20:10;}
 else if(k==='days'){hi=Math.max(7,Math.max.apply(null,nn)); lo=0; step=hi>10?2:1;}

 for(v=lo;v<=hi;v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#e3e0d8"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" font-size="12" text-anchor="end" fill="#6b665f">'+v+'</text>';
 st.forEach(function(x,i){g+='<text x="'+X(i)+'" y="'+(H-B+22)+'" font-size="13" font-weight="'+(i===vm.sel?700:500)+'" text-anchor="middle" fill="'+(i===vm.sel?'#2E3A55':'#262220')+'">'+x.n+'주</text>';});
 var segs=[],cur=[];
 vals.forEach(function(val,i){if(val==null){if(cur.length)segs.push(cur);cur=[];}else cur.push(X(i)+','+Y(val));});
 if(cur.length)segs.push(cur);
 segs.forEach(function(sg){if(sg.length>1)g+='<polyline points="'+sg.join(' ')+'" fill="none" stroke="#2E3A55" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';});
 st.forEach(function(x,i){

 });

function vokaSummary(){

/* VOKA 탭: 레벨(A1-A2, B1, B2, C1)을 고른 뒤 주차별 학생용 리포트를 봅니다. A1과 A2로 올린 기록은 A1-A2로 묶습니다 */

<script>
/* 로그인 화면의 「홈 화면에 추가」: 핸드폰 바탕화면에 학습 포탈 아이콘을 만듭니다(SODA-Lehrwerk 앱들의 「홈 화면에 앱 추가」와 같은 방식).
   - Android Chrome 등 설치를 지원하는 브라우저는 버튼을 누르면 바로 설치 창이 뜹니다.
   - 아이폰(Safari)은 설치 창을 띄울 수 없어 공유 → 홈 화면에 추가 순서를 보여 줍니다.
   - 카카오톡 같은 앱 안의 브라우저에서는 홈 화면에 추가할 수 없어 다른 브라우저로 여는 방법을 보여 줍니다.
   - 이미 홈 화면 아이콘으로 연 경우와 컴퓨터(설치 지원 브라우저 제외)에서는 버튼을 보이지 않습니다. */
(function(){
 if(location.protocol==='file:') return;
 var ua=navigator.userAgent||'';
 var standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
 var ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 var android=/Android/i.test(ua), kakao=/KAKAOTALK/i.test(ua);
 var inapp=kakao||/NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|Teams/i.test(ua);
 var deferred=null, sheet=null, last=null;
 function can(){return !standalone&&!!(deferred||ios||android||inapp);}
 var SHARE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
 var PHONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 8v6M9 11h6"/></svg>';
 function guide(){
  if(inapp){
   var url=location.href.split('#')[0];
   return {t:'브라우저에서 열어 주십시오',go:true,c:'<p>카카오톡이나 Teams 같은 앱 안에서 연 화면에서는 홈 화면에 추가할 수 없습니다.</p>'
    +(kakao?'<a class="a2hs-go" href="kakaotalk://web/openExternal?url='+encodeURIComponent(url)+'">다른 브라우저로 열기</a>':'')
    +'<ol><li>화면 위나 아래의 <b>⋮</b> 또는 <b>⋯</b> 메뉴를 누릅니다.</li><li><b>다른 브라우저로 열기</b>(아이폰은 <b>Safari로 열기</b>)를 누릅니다.</li><li>'+(ios?'Safari':'Chrome')+'에서 다시 <b>홈 화면에 추가</b>를 누릅니다.</li></ol>'};
  }
  if(ios) return {t:'홈 화면에 추가',c:'<ol><li>Safari 아래(또는 위)의 공유 버튼 '+SHARE+'을 누릅니다. 버튼이 보이지 않으면 <b>⋯</b> 메뉴 안에 있습니다.</li><li><b>홈 화면에 추가</b>를 누르고 <b>추가</b>를 누릅니다.</li><li>바탕화면에 생긴 <b>학습 포탈</b> 아이콘으로 엽니다.</li></ol>'
   +'<p class="n">아이폰에서는 홈 화면 아이콘으로 처음 열 때 한 번 더 로그인합니다.</p>'};
  return {t:'홈 화면에 추가',c:'<ol><li>브라우저 오른쪽 위나 아래의 메뉴 <b>⋮</b> 또는 <b>≡</b>를 누릅니다.</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누릅니다.</li><li>바탕화면에 생긴 <b>학습 포탈</b> 아이콘으로 엽니다.</li></ol>'};
 }
 function build(){
  if(sheet) return;
  sheet=document.createElement('div'); sheet.className='a2hs-sheet'; sheet.hidden=true;
  sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true'); sheet.setAttribute('aria-labelledby','a2hs-t');
  sheet.innerHTML='<div class="a2hs-bg" data-close></div><div class="a2hs-box" tabindex="-1"><h2 class="a2hs-t" id="a2hs-t"></h2><div class="a2hs-c"></div><button type="button" class="a2hs-ok" data-close>확인</button></div>';
  sheet.addEventListener('click',function(e){if(e.target.closest('[data-close]')) close();});
  document.body.appendChild(sheet);
 }
 function open(){
  build(); var g=guide();
  sheet.querySelector('.a2hs-t').textContent=g.t; sheet.querySelector('.a2hs-c').innerHTML=g.c;
  var ok=sheet.querySelector('.a2hs-ok'); ok.className='a2hs-ok'+(g.go?' ghost':''); ok.textContent=g.go?'닫기':'확인';
  last=document.activeElement; sheet.hidden=false; sheet.querySelector('.a2hs-box').focus();
 }
 function close(){if(!sheet||sheet.hidden) return; sheet.hidden=true; if(last&&last.focus) last.focus();}
 function onClick(){
  if(deferred&&!inapp){var d=deferred; deferred=null; d.prompt(); (d.userChoice||Promise.resolve()).then(refresh,refresh); return;}
  open();
 }
 function refresh(){var l=document.querySelectorAll('.a2hs-btn'),i; for(i=0;i<l.length;i++) l[i].hidden=!can();}
 /* 로그인 화면은 다시 그려지므로 그려질 때마다 안내 문구 아래에 버튼을 붙입니다 */
 function mount(){
  var lg=document.querySelector('#app .login'); if(!lg||lg.querySelector('.a2hs-btn')) return;
  var help=lg.querySelector('.lg-help'); if(!help) return;
  var b=document.createElement('button'); b.type='button'; b.className='a2hs-btn'; b.innerHTML=PHONE+'<span>홈 화면에 추가</span>'; b.hidden=!can();
  b.addEventListener('click',onClick); help.parentNode.insertBefore(b,help.nextSibling);
 }
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault(); deferred=e; refresh();});
 window.addEventListener('appinstalled',function(){deferred=null; standalone=true; refresh(); close();});
 document.addEventListener('keydown',function(e){if(e.key==='Escape') close();});
 mount(); new MutationObserver(mount).observe(document.getElementById('app'),{childList:true});
})();
</script>
<script src="admin.js?v=5"></script>
</body>
</html>
